<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APINAC Lists - Inicio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* ESTILOS CON LOS NUEVOS BASAMIENTOS DE LA DIVISIÓN INVESTIGACIÓN */
        :root {
            --bg: #091212;            /* Fondo oscuro profundo con matiz de la división */
            --card: #0f1c1b;          /* Contenedores de listas basados en el tono */
            --text: #e1eceb;          /* Letras principales con un sutil gélido/verdoso */
            --accent: #006361;        /* COLOR PRINCIPAL DE LA DIVISIÓN INVESTIGACIÓN */
            --sub-text: #6f8583;      /* Color secundario apagado para descripciones */
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg); 
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.4;
        }
        header { text-align: center; margin-bottom: 30px; }
        h1 { font-size: 1.2rem; color: #fff; margin-bottom: 5px; }
        .sub { font-size: 0.8rem; color: var(--sub-text); }
        
        .container { max-width: 500px; margin: auto; }
        
        .card-lista {
            background: var(--card);
            border: 1px solid #1c3533; /* Borde oscuro en la gama de la división */
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card-lista:active { transform: scale(0.97); }
        
        h3 { 
            margin: 0; 
            font-size: 0.95rem; 
            color: var(--text);        /* Cambiado a texto claro para que sea más legible en móviles */
            font-weight: 600;
            transition: color 0.2s;
        }
        /* Cuando se interactúe con la tarjeta, el título brillará con el color de la división */
        .card-lista:active h3 {
            color: var(--accent);
        }
        p { 
            margin: 5px 0 0; 
            font-size: 0.75rem; 
            color: var(--sub-text); 
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Bienvenido a APINAC Lists</h1>
            <p class="sub">Seleccione una lista para comenzar.</p>
        </header>

        <main>
            <div class="card-lista" onclick="irALista('sexto_tigre')">
                <h3>6to Grado "D" - UE "El Tigre"</h3>
                <p>Para recordar esos tiempos.</p>
            </div>

            <div class="card-lista" onclick="irALista('primero_bello')">
                <h3>1er Año "U" - UEIP "Andrés Bello"</h3>
                <p>El Archivo de la primera.</p>
            </div>

            <div class="card-lista" onclick="irALista('segundo_bello')">
                <h3>2do Año "U" - UEIP "Andrés Bello"</h3>
                <p>Nuestra etapa actual.</p>
            </div>

            <div class="card-lista" onclick="irALista('soulsnow_family')">
                <h3>Mercier Shizukesa Family.</h3>
                <p>La Familia.</p>
            </div>
        </main>
    </div>

    <script>
        function irALista(id) {
            window.location.href = `estudiantes.html?lista=${id}`;
        }
    </script>
</body>
</html>
